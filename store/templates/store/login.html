{% extends 'store/base.html' %}

{% block content %}

<section class="min-h-screen flex items-center justify-center px-5 py-20">

<div class="w-full max-w-md">

<div class="bg-[#141414]/90 backdrop-blur-xl rounded-3xl border border-neutral-800 shadow-2xl p-8">

<div class="text-center mb-10">

<p class="uppercase tracking-[6px] text-orange-400 text-xs">

WELCOME BACK

</p>

<h1 class="mt-3 text-4xl font-bold tracking-[6px] text-white">

KEEN | KEECH

</h1>

<p class="mt-3 text-neutral-400 text-sm">

Sign in to continue shopping.

</p>

</div>

<form method="POST" class="space-y-6">

{% csrf_token %}

{% for field in form %}

<div>

<label class="block text-[11px] uppercase tracking-[3px] text-neutral-400 mb-2">

{{ field.label }}

</label>

{{ field }}

{% if field.errors %}

<p class="text-red-400 text-xs mt-2">

{{ field.errors|striptags }}

</p>

{% endif %}

</div>

{% endfor %}

<button type="submit"

class="w-full bg-orange-500 hover:bg-orange-400 text-black font-bold uppercase tracking-[4px] py-4 rounded-xl transition duration-300">

LOGIN

</button>

</form>

<div class="mt-8 text-center">

<p class="text-neutral-400 text-sm">

Don't have an account?

</p>

<a href="{% url 'register' %}"

class="mt-3 inline-block text-orange-400 uppercase tracking-[3px] text-sm hover:text-orange-300">

Create Account →

</a>

</div>

</div>

</div>

</section>

{% endblock %}
