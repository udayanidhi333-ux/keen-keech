<div class="grid grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-10">

{% for product in products %}

<div class="group">

    <!-- IMAGE -->
    <div class="relative overflow-hidden rounded-2xl bg-[#171717]">

        <a href="{% url 'product_detail' product.id %}">

            {% if product.image %}

            <img src="{{ product.image.url }}"
                 alt="{{ product.name }}"
                 class="w-full
                        h-[250px]
                        sm:h-[340px]
                        lg:h-[430px]
                        object-cover
                        transition-all duration-700
                        group-hover:scale-105">

            {% else %}

            <div class="w-full
                        h-[250px]
                        sm:h-[340px]
                        lg:h-[430px]
                        flex items-center justify-center
                        bg-neutral-800
                        text-neutral-500">

                No Image

            </div>

            {% endif %}

        </a>

        <!-- GRADIENT OVERLAY -->

        <div class="absolute inset-0
                    bg-gradient-to-t
                    from-black/30
                    to-transparent
                    pointer-events-none">

        </div>

    </div>


    <!-- DETAILS -->

    <div class="pt-4">


        <!-- PRODUCT NAME + WISHLIST -->

        <div class="flex items-start justify-between gap-3">

            <a href="{% url 'product_detail' product.id %}"
               class="flex-1">

                <h3 class="text-white
                           text-[12px]
                           sm:text-[14px]
                           font-medium
                           leading-5
                           tracking-wide
                           line-clamp-2
                           min-h-[40px]">

                    {{ product.name }}

                </h3>

            </a>


            <!-- WISHLIST HEART -->

            {% if user.is_authenticated %}

            <a href="{% url 'add_to_wishlist' product.id %}"
               class="flex-shrink-0
                      mt-1
                      transition-transform
                      duration-300
                      hover:scale-110">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     stroke="currentColor"
                     stroke-width="2"
                     class="w-6 h-6

                     {% if product.id in wishlist_products %}

                         fill-current text-red-500

                     {% else %}

                         fill-none text-neutral-400 hover:text-red-500

                     {% endif %}">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364 4.318 12.682a4.5 4.5 0 010-6.364z"/>

                </svg>

            </a>

            {% endif %}

        </div>


        <!-- PRICE -->

        <div class="flex items-center justify-between mt-2">

            <p class="text-orange-400
                      text-[15px]
                      sm:text-lg
                      font-semibold">

                ₹{{ product.price }}

            </p>

        </div>


        <!-- PREMIUM VIEW DETAILS BUTTON -->

        <a href="{% url 'product_detail' product.id %}"

           class="mt-4
                  inline-flex
                  items-center
                  gap-2
                  px-4
                  py-2
                  rounded-full
                  border
                  border-yellow-500/30
                  bg-yellow-500/[0.04]
                  text-[10px]
                  sm:text-[11px]
                  uppercase
                  tracking-[2px]
                  text-yellow-200/80
                  shadow-[0_0_12px_rgba(234,179,8,0.12)]
                  hover:border-yellow-400/70
                  hover:bg-yellow-500/10
                  hover:text-yellow-300
                  hover:shadow-[0_0_22px_rgba(234,179,8,0.35)]
                  transition-all
                  duration-500">

            View Details

            <span class="text-base
                         transition-transform
                         duration-300
                         group-hover:translate-x-1">

                →

            </span>

        </a>


    </div>

</div>


{% empty %}


<div class="col-span-full
            text-center
            py-20
            text-neutral-500">

    No Products Available

</div>


{% endfor %}

</div>
