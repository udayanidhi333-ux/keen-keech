<!-- CATEGORY SECTION -->

<div class="mb-16">

    <!-- CATEGORY HEADER -->

    <div class="flex items-center justify-between mb-8">

        <div>

            <p class="text-neutral-500 uppercase tracking-[5px] text-xs">
                Explore
            </p>

            <h2 class="text-2xl sm:text-3xl font-semibold text-white mt-2">
                {{ category.name }}
            </h2>

        </div>

        <!-- VIEW ALL -->

        <a href="{% url 'home' %}?category={{ category.slug }}#collection"
           class="group flex items-center gap-2
                  text-xs
                  uppercase
                  tracking-[2px]
                  text-neutral-400
                  hover:text-orange-400
                  transition">

            View All

            <span class="text-xl transition-transform duration-300 group-hover:translate-x-2">
                →
            </span>

        </a>

    </div>

    <!-- PRODUCTS -->

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-6">

        {% for product in products %}

        <div class="group">

            <!-- IMAGE -->

            <div class="relative overflow-hidden rounded-2xl bg-[#171717]">

                <a href="{% url 'product_detail' product.id %}">

                    {% if product.image %}

                    <img src="{{ product.image.url }}"
                         alt="{{ product.name }}"
                         class="w-full
                                h-[250px]
                                sm:h-[340px]
                                lg:h-[430px]
                                object-cover
                                transition-all
                                duration-700
                                group-hover:scale-105">

                    {% else %}

                    <div class="w-full
                                h-[250px]
                                sm:h-[340px]
                                lg:h-[430px]
                                flex
                                items-center
                                justify-center
                                bg-neutral-800
                                text-neutral-500">

                        No Image

                    </div>

                    {% endif %}

                </a>

                <div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent pointer-events-none"></div>

            </div>

            <!-- DETAILS -->

            <div class="pt-2">

                <div class="flex items-start justify-between gap-2">

                    <a href="{% url 'product_detail' product.id %}" class="flex-1">

                        <h3 class="text-white
                                   text-[12px]
                                   sm:text-[14px]
                                   font-medium
                                   leading-5
                                   tracking-wide
                                   line-clamp-2
                                   h-[34px]">

                            {{ product.name }}

                        </h3>

                    </a>

                    <!-- WISHLIST -->

                    {% if user.is_authenticated %}

                    <a href="{% url 'add_to_wishlist' product.id %}"
                       class="flex-shrink-0 mt-1 hover:scale-110 transition duration-300">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             viewBox="0 0 24 24"
                             stroke="currentColor"
                             stroke-width="2"
                             class="w-5 h-5 {% if product.id in wishlist_products %}fill-current text-red-500{% else %}fill-none text-neutral-400 hover:text-red-500{% endif %}">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364 4.318 12.682a4.5 4.5 0 010-6.364z"/>

                        </svg>

                    </a>

                    {% endif %}

                </div>

                <!-- PRICE -->

                <div class="mt-1">

                    <p class="text-orange-400 text-[15px] sm:text-lg font-semibold">

                        ₹{{ product.price }}

                    </p>

                </div>

                <!-- BUTTON -->

                <a href="{% url 'product_detail' product.id %}"
                   class="mt-3
                          inline-flex
                          items-center
                          gap-2
                          px-4
                          py-2
                          rounded-full
                          border
                          border-yellow-500/30
                          bg-yellow-500/[0.04]
                          text-[10px]
                          sm:text-[11px]
                          uppercase
                          tracking-[2px]
                          text-yellow-200/80
                          shadow-[0_0_12px_rgba(234,179,8,0.12)]
                          hover:border-yellow-400/70
                          hover:bg-yellow-500/10
                          hover:text-yellow-300
                          hover:shadow-[0_0_22px_rgba(234,179,8,0.35)]
                          transition-all
                          duration-500">

                    View Details

                    <span class="text-base transition-transform duration-300 group-hover:translate-x-1">

                        →

                    </span>

                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>
