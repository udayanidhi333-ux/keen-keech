{% extends "store/base.html" %}

{% block content %}

<section class="bg-black min-h-screen py-20">

<div class="max-w-7xl mx-auto px-4">


    <div class="mb-12">

        <p class="text-neutral-500 uppercase tracking-[5px] text-xs">
            Collection
        </p>

        <h1 class="mt-4 text-4xl font-bold text-white">
            {{ category.name }}
        </h1>

    </div>



    <!-- TAGS -->

    <div class="flex gap-3 overflow-x-auto no-scrollbar mb-10">


        <button
        class="tag-filter px-5 py-2 rounded-full bg-gradient-to-r from-orange-500 to-yellow-500 text-black"
        data-tag="all"
        data-category="{{ category.id }}">

        ALL

        </button>



        {% for tag in tags %}

        <button
        class="tag-filter px-5 py-2 rounded-full border border-neutral-700 text-white"
        data-tag="{{ tag.id }}"
        data-category="{{ category.id }}">

        {{ tag.name }}

        </button>

        {% endfor %}


    </div>




    <!-- PRODUCTS -->


    <div
    id="product-grid-{{ category.id }}"
    class="grid grid-cols-2 lg:grid-cols-4 gap-6">



    {% for product in products %}


    <div class="group">


        <a href="{% url 'product_detail' product.id %}">

            {% if product.image %}

            <img src="{{ product.image.url }}"
            class="w-full h-[400px] object-cover rounded-xl">

            {% endif %}

        </a>



        <h3 class="text-white mt-4">

            {{ product.name }}

        </h3>


        <p class="text-orange-400 mt-2">

            ₹{{ product.price }}

        </p>



        <a href="{% url 'product_detail' product.id %}"
        class="inline-block mt-3 border border-yellow-500 px-4 py-2 rounded-full text-yellow-300 text-xs">

        VIEW DETAILS

        </a>


    </div>



    {% endfor %}



    </div>



</div>

</section>



<script>

document.querySelectorAll(".tag-filter").forEach(button => {


button.addEventListener("click", function(){


let tag = this.dataset.tag;

let category = this.dataset.category;


fetch(`/category-filter/?tag=${tag}&category=${category}`)


.then(response => response.json())


.then(data => {


let grid = document.getElementById(
`product-grid-${category}`
);


grid.innerHTML = "";


data.products.forEach(product => {


grid.innerHTML += `


<div class="group">

<a href="/product/${product.id}/">

<img src="${product.image}"
class="w-full h-[400px] object-cover rounded-xl">

</a>


<h3 class="text-white mt-4">

${product.name}

</h3>


<p class="text-orange-400 mt-2">

₹${product.price}

</p>


<a href="/product/${product.id}/"
class="inline-block mt-3 border border-yellow-500 px-4 py-2 rounded-full text-yellow-300 text-xs">

VIEW DETAILS

</a>


</div>


`;


});


});


});


});


</script>



{% endblock %}
